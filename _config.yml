# Site settings. Jekyll does not reload this file while `jekyll serve` is
# running; restart the server after editing it.

title: 袁宝鹏
tagline: 工程手记
email: yuanbaopeng2008@163.com
description: >-
  袁宝鹏的工程手记，记录训练系统与性能工程中计算、存储和通信之间的取舍，以及一些还在验证的问题。
baseurl: ""
url: "https://www.yuanbaopeng.com"
lang: zh-CN
timezone: Asia/Shanghai
logo: /favicon.png
github_username: yuanbaopeng
author:
  name: 袁宝鹏
  url: "https://www.yuanbaopeng.com/about/"
social:
  name: 袁宝鹏
  links:
    - "https://github.com/yuanbaopeng"

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

defaults:
  # Share image used when a page or post does not set its own `image`.
  - scope:
      path: ""
    values:
      image: /assets/images/og.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: 袁宝鹏
  # 对话札记: every post under notes/_posts. See README.md for the convention.
  - scope:
      path: "notes/_posts"
      type: posts
    values:
      kind: note
      permalink: /notes/:year/:month/:title/

# Jekyll 3 replaces its built-in exclude list with this one, so the usual
# entries (Gemfile, vendor, ...) have to be repeated here.
exclude:
  - dist
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
