- title: 训练系统该向 Agent 暴露哪些观测信息？
  summary: 从任务状态、排队原因到性能指标，哪些信息足以支持判断，又怎样保留判断所需的上下文？
  detail: 任务显示为运行中，并不意味着训练已经开始。Agent 需要知道哪些事实，才能区分资源等待、环境准备和真正的计算瓶颈？信息的时效性与缺失，又该怎样表达？
- title: GPU 任务需要排队时，性能实验怎样继续？
  summary: 当提交与结果之间隔着一段等待，怎样组织异步实验、保存假设，并在结果回来后继续比较？
  detail: 一次实验可能要等很久才有结果。怎样记录代码版本、环境和预期，避免下一轮比较丢失上下文？等待期间可以先做哪些分析，什么又必须等到实际测量后再判断？
